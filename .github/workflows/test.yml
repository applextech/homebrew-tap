name: Test Homebrew formula

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - ".github/workflows/test.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1
        with:
          core: true
          cask: false
      - name: Trust the formula under test
        run: brew trust --formula applextech/tap/fedcli
      - name: Audit formula
        run: brew audit --strict --online applextech/tap/fedcli
      - name: Install FedCLI
        run: brew install applextech/tap/fedcli
      - name: Verify FedCLI
        run: fedcli --help
